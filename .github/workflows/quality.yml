name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/freelanceos_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/freelanceos_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freelanceos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d freelanceos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply Prisma migrations
        run: pnpm test:db:migrate

      - name: Unit tests
        run: pnpm test

      - name: Persistence integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build
